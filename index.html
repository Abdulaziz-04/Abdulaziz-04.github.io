<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Abdulaziz Suria | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css"
    />
  </head>
  <body class="home-page">
    <div class="page-loader" data-page-loader>
      <div class="page-loader__orb" aria-hidden="true">
        <div class="page-loader__core"></div>
      </div>
      <p class="page-loader__text">Loading portfolio…</p>
    </div>

    <div class="template-slot" data-template="assets/templates/header.html">
      <p class="loading-text">Loading navigation...</p>
    </div>

    <main>
      <div
        class="template-slot"
        data-template="assets/templates/experience.html"
      >
        <p class="loading-text">Loading experience...</p>
      </div>
      <div
        class="template-slot"
        data-template="assets/templates/academic.html"
      >
        <p class="loading-text">Loading academic highlights...</p>
      </div>
      <div
        class="template-slot"
        data-template="assets/templates/education.html"
      >
        <p class="loading-text">Loading education...</p>
      </div>
      <div class="template-slot" data-template="assets/templates/projects.html">
        <p class="loading-text">Loading projects...</p>
      </div>
      <div class="template-slot" data-template="assets/templates/skills.html">
        <p class="loading-text">Loading skills...</p>
      </div>
      <div
        class="template-slot"
        data-template="assets/templates/certifications.html"
      >
        <p class="loading-text">Loading certifications...</p>
      </div>
      <div
        class="template-slot"
        data-template="assets/templates/outside-work.html"
      >
        <p class="loading-text">Loading outside of work...</p>
      </div>
    </main>

    <div class="template-slot" data-template="assets/templates/footer.html">
      <p class="loading-text">Loading footer...</p>
    </div>

    <a
      class="floating-chat-btn"
      href="https://az-tech-ai.vercel.app/"
      target="_blank"
      rel="noreferrer"
      aria-label="Chat with AZTech-AI"
      data-track="chat-aztech-floating"
    >
      <span class="floating-chat-btn__icon" aria-hidden="true">
        <img
          src="assets/img/chatbot_icon.png"
          alt=""
          class="floating-chat-btn__icon-img"
          loading="lazy"
        />
      </span>
      <span class="floating-chat-btn__label">AZTech-AI</span>
    </a>

    <script src="assets/js/main.js"></script>
  </body>
</html>
